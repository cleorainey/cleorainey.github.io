<style>
/* ================= LIGHTBOX & GALLERY ================= */
.gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    justify-content: center;
}

.gallery a {
    flex: 1 1 150px; /* flexible width, minimum 150px */
    max-width: 200px; /* prevents images from being huge on desktop */
    text-align: center;
}

.gallery img {
    width: 100%;
    height: auto;
    cursor: pointer;
    border: 2px solid black;
}

/* Lightbox overlay */
.lightbox {
    display: none;
    position: fixed;
    top:0;
    left:0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.95);
    z-index: 1000;
    text-align: center;
    padding: 20px;
    overflow-y: auto;
}

.lightbox:target {
    display: block;
}

/* Content inside lightbox */
.lightbox-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 90%;
    margin: auto;
}

/* Image inside lightbox */
.lightbox-content img {
    max-width: 100%;
    max-height: 70vh; /* leaves space for caption */
    margin-bottom: 10px;
}

/* Caption styling */
.lightbox .caption {
    color: white;
    font-family: "Courier New", monospace;
    font-size: 16px;
    background-color: rgba(0,0,0,0.6);
    padding: 5px 10px;
    border: 1px dotted yellow;
    text-align: center;
    display: block;
    margin-bottom: 10px;
}

/* Close link */
.lightbox .close-link {
    color: yellow;
    font-size: 20px;
    text-decoration: none;
    margin-bottom: 10px;
    align-self: flex-end;
}

/* Responsive adjustments */
@media (max-width: 1024px) {
    .gallery a {
        flex: 1 1 130px;
        max-width: 150px;
    }
}

@media (max-width: 768px) {
    .gallery {
        gap: 5px;
    }
    .gallery a {
        flex: 1 1 100px;
        max-width: 120px;
    }
}
</style>
</head>
